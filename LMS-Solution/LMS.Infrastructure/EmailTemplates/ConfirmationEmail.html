<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color:#F4F6F9; padding:40px;">
    <div style="max-width:600px; margin:auto; background:#ffffff; padding:30px; border-radius:12px; box-shadow:0 3px 12px rgba(0,0,0,0.1);">

        <h2 style="color:#4C6EF5; text-align:center; margin-bottom:30px;">
            Confirm Your Email
        </h2>

        <p style="font-size:16px; color:#333;">
            Hello,
            <br /><br />
            Thank you for registering on our LMS platform. Please confirm your email address to activate your account and start learning.
        </p>

        <div style="text-align:center; margin:40px 0;">
            <a href="{{ConfirmationLink}}"
               style="background:#4C6EF5; color:white; padding:14px 26px; text-decoration:none; border-radius:6px; font-size:16px; display:inline-block;">
                Confirm Email
            </a>
        </div>

        <p style="font-size:14px; color:#555;">
            If you didn’t create an account, please ignore this message.
        </p>

        <hr style="border:none; border-top:1px solid #eee; margin:30px 0;">

        <p style="font-size:13px; color:#888; text-align:center;">
            © 2025 Your LMS Platform — All rights reserved.
        </p>

    </div>
</body>
</html>
