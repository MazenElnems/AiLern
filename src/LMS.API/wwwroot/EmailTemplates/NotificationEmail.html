<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#020617;font-family:Segoe UI,Arial,sans-serif;color:#e2e8f0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                       style="background:linear-gradient(145deg,#020617,#0f172a);
                              border-radius:12px;
                              padding:40px;
                              border:1px solid rgba(59,130,246,0.2);
                              box-shadow:0 0 30px rgba(59,130,246,0.15);">

                    <!-- Header -->
                    <tr>
                        <td>
                            <h2 style="color:#3b82f6;margin:0;">AiLern</h2>
                        </td>
                    </tr>

                    <!-- Title -->
                    <tr>
                        <td style="padding-top:10px;">
                            <h1 style="margin:0;">{{Title}}</h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding-top:20px;">
                            <p>Hello <strong>{{FullName}}</strong>,</p>

                            <p style="color:#cbd5e1; line-height:1.6;">
                                {{Message}}
                            </p>
                        </td>
                    </tr>

                    <!-- Dynamic Button -->
                    {{ActionButton}}

                    <!-- Footer -->
                    <tr>
                        <td>
                            <hr style="border:none;border-top:1px solid #1e293b;margin:30px 0;">
                            <p style="color:#64748b;font-size:14px;">
                                © 2026 AiLern
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
